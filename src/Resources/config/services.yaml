services:
    _defaults:
        autowire: false
        autoconfigure: false
        public: false

    Manuxi\SuluArticleConfigurationBundle\Repository\ArticleConfigurationRepository:
        arguments:
            - '@doctrine'
        tags:
            - { name: 'doctrine.repository_service' }

    Manuxi\SuluArticleConfigurationBundle\Service\ArticleGroupProvider:
        arguments:
            - '@sulu_admin.metadata_group_provider'

    Manuxi\SuluArticleConfigurationBundle\Admin\FormMetadata\ArticleConfigurationFormComposer:
        arguments:
            - '@sulu_admin.xml_form_metadata_loader'
            - '@Manuxi\SuluArticleConfigurationBundle\Service\ArticleGroupProvider'
            - '@sulu_admin.schema_metadata_provider'

    Manuxi\SuluArticleConfigurationBundle\Admin\FormMetadata\ArticleConfigurationFormMetadataLoader:
        arguments:
            - '@Manuxi\SuluArticleConfigurationBundle\Admin\FormMetadata\ArticleConfigurationFormComposer'
        tags:
            # Must run before Sulu's XML loader, which knows the raw template file under the same key
            - { name: 'sulu_admin.form_metadata_loader', priority: 1024 }

    Manuxi\SuluArticleConfigurationBundle\Schema\ConfigurationSchema:
        arguments:
            - '@Manuxi\SuluArticleConfigurationBundle\Admin\FormMetadata\ArticleConfigurationFormComposer'

    Manuxi\SuluArticleConfigurationBundle\Command\MigrateToJsonCommand:
        arguments:
            - '@doctrine.dbal.default_connection'
        tags:
            - { name: 'console.command' }

    Manuxi\SuluArticleConfigurationBundle\Service\ArticleConfigurationResolver:
        public: true
        arguments:
            - '@Manuxi\SuluArticleConfigurationBundle\Repository\ArticleConfigurationRepository'
            - '@Manuxi\SuluArticleConfigurationBundle\Schema\ConfigurationSchema'

    Manuxi\SuluArticleConfigurationBundle\Service\ArticleTemplateResolver:
        public: true
        arguments:
            - '@Sulu\Route\Domain\Repository\RouteRepositoryInterface'
            - '@sulu_article.article_repository'
            - '@Sulu\Content\Application\ContentManager\ContentManagerInterface'

    Manuxi\SuluArticleConfigurationBundle\Twig\ArticleConfigurationExtension:
        arguments:
            - '@Manuxi\SuluArticleConfigurationBundle\Service\ArticleConfigurationResolver'
            - '@Manuxi\SuluArticleConfigurationBundle\Service\ArticleTemplateResolver'
        tags:
            - { name: 'twig.extension' }

    Manuxi\SuluArticleConfigurationBundle\Controller\Admin\ArticleConfigurationController:
        public: true
        arguments:
            - '@Manuxi\SuluArticleConfigurationBundle\Repository\ArticleConfigurationRepository'
            - '@doctrine.orm.entity_manager'
            - '@sulu_article.article_repository'
            - '@Sulu\Content\Application\ContentAggregator\ContentAggregatorInterface'
            - '@Manuxi\SuluArticleConfigurationBundle\Schema\ConfigurationSchema'
            - '@fos_rest.view_handler'
        tags:
            - { name: 'sulu.context', context: 'admin' }

    Manuxi\SuluArticleConfigurationBundle\Admin\ArticleConfigurationAdmin:
        arguments:
            - '@sulu_admin.view_builder_factory'
            - '@Manuxi\SuluArticleConfigurationBundle\Service\ArticleGroupProvider'
            - '@sulu_security.security_checker'
        tags:
            - { name: 'sulu.admin', priority: -10 }
            - { name: 'sulu.context', context: 'admin' }