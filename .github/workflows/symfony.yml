name: Symfony

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  symfony-tests-matrix:
    name: symfony-tests (${{ matrix.sulu }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sulu: [ '3.0.0', '^3.0' ]
    env:
      # Sulu 3.0.0 to 3.0.7 have published advisories; only the oldest-release leg installs them on purpose
      COMPOSER_NO_SECURITY_BLOCKING: ${{ matrix.sulu == '^3.0' && '0' || '1' }}
    steps:
    #  To automatically get bug fixes and new Php versions for shivammathur/setup-php,
    # change this to (see https://github.com/shivammathur/setup-php#bookmark-versioning):
    # uses: shivammathur/setup-php@v2
    - uses: shivammathur/setup-php@2cb9b829437ee246e9b3cac53555a39208ca6d28
      with:
        php-version: '8.2'
    - uses: actions/checkout@v4
    - name: Select the Sulu version
      run: composer require "sulu/sulu:${{ matrix.sulu }}" --no-update
    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ matrix.sulu }}-${{ hashFiles('**/composer.json') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.sulu }}-
    - name: Install Dependencies
      run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
    - name: Create Database
      run: |
        mkdir -p data
        touch data/database.sqlite
    - name: Execute tests (Unit and Feature tests) via PHPUnit
      env:
        DATABASE_URL: sqlite:///%kernel.project_dir%/data/database.sqlite
      run: vendor/bin/phpunit

  # Required status check "symfony-tests": one stable name, independent of the matrix entries
  symfony-tests:
    needs: symfony-tests-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
    - name: All Sulu versions passed
      run: |
        if [ "${{ needs.symfony-tests-matrix.result }}" != "success" ]; then
          echo "Matrix result: ${{ needs.symfony-tests-matrix.result }}"
          exit 1
        fi
